# Every login session on the server, and everything run from one by hand (sudo included), is held to
# this much memory in total, so nothing typed at a prompt can starve the collector. On 26 September
# 2026 a replay run by hand over ssh filled the 4 GB machine, and the kernel killed the collector
# twice before it killed the replay. Deliberate diagnostic jobs go through deploy/server-job.sh, which
# gives each its own ceiling; heavy replays run on a laptop, not here (deploy/README.md, "Memory").
[Slice]
MemoryHigh=700M
MemoryMax=900M
MemorySwapMax=0
